<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#161f3c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#tile)"/>

  <!-- little stave with notes, top-right -->
  <g stroke="#3a4a78" stroke-width="1.5">
    <line x1="960" y1="70" x2="1130" y2="70"/><line x1="960" y1="82" x2="1130" y2="82"/>
    <line x1="960" y1="94" x2="1130" y2="94"/><line x1="960" y1="106" x2="1130" y2="106"/>
    <line x1="960" y1="118" x2="1130" y2="118"/>
  </g>
  <g fill="#818cf8">
    <ellipse cx="992" cy="112" rx="7" ry="5" transform="rotate(-20 992 112)"/>
    <ellipse cx="1036" cy="100" rx="7" ry="5" transform="rotate(-20 1036 100)"/>
    <ellipse cx="1080" cy="88" rx="7" ry="5" transform="rotate(-20 1080 88)"/>
  </g>
  <g stroke="#818cf8" stroke-width="2.5">
    <line x1="998" y1="110" x2="998" y2="72"/>
    <line x1="1042" y1="98" x2="1042" y2="60"/>
    <line x1="1086" y1="86" x2="1086" y2="48"/>
  </g>
  <text x="1104" y="132" fill="#6b7aa8" font-size="26" font-weight="800" font-style="italic" font-family="Georgia, 'Times New Roman', serif">p</text>

  <text x="80" y="100" fill="#818cf8" font-size="21" font-weight="700" letter-spacing="3">SOLVING GUIDE · DAILYCRYPTIC</text>

  <g fill="#ffffff" font-weight="800">
    <text x="78" y="184" font-size="64">Music in Cryptics:</text>
    <text x="78" y="256" font-size="64">Notes, Dynamics &amp; Decoys</text>
  </g>
  <text x="80" y="306" fill="#cbd5e1" font-size="26" font-weight="500">Soft is P, loud is F, and a &#8220;note&#8221; can be any letter from A to G.</text>

  <!-- soft = P -->
  <g transform="translate(80,392)">
    <rect x="0" y="0" width="220" height="118" rx="16" fill="url(#tile)"/>
    <text x="110" y="60" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle">&#8220;soft&#8221;</text>
    <text x="110" y="96" fill="#dfe3f7" font-size="20" font-weight="600" text-anchor="middle">clue surface</text>

    <text x="255" y="66" fill="#6b7aa8" font-size="40" font-weight="800" text-anchor="middle">=</text>

    <rect x="290" y="0" width="180" height="118" rx="16" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="380" y="60" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle">P</text>
    <text x="380" y="96" fill="#a5b4fc" font-size="20" font-weight="700" text-anchor="middle">piano</text>
  </g>

  <!-- loud = F -->
  <g transform="translate(620,392)">
    <rect x="0" y="0" width="220" height="118" rx="16" fill="url(#tile)"/>
    <text x="110" y="60" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle">&#8220;loud&#8221;</text>
    <text x="110" y="96" fill="#dfe3f7" font-size="20" font-weight="600" text-anchor="middle">clue surface</text>

    <text x="255" y="66" fill="#6b7aa8" font-size="40" font-weight="800" text-anchor="middle">=</text>

    <rect x="290" y="0" width="180" height="118" rx="16" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="380" y="60" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle">F</text>
    <text x="380" y="96" fill="#a5b4fc" font-size="20" font-weight="700" text-anchor="middle">forte</text>
  </g>
</svg>
