<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="450" rx="20" fill="url(#fbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="54" fill="#ffffff" font-size="28" font-weight="800">A setter&#8217;s fingerprints</text>
  <text x="44" y="84" fill="#94a3b8" font-size="17" font-weight="500">Six tells that add up to a recognisable voice.</text>

  <g font-weight="700">
    <!-- each row: label chip + spectrum -->
    <g transform="translate(44,112)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#243358"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Favourite device</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">anagrams · charades · &amp;lit · cryptic definitions</text>
    </g>
    <g transform="translate(44,164)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#243358"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Humour</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">groan-worthy puns  &#8596;  dry and precise</text>
    </g>
    <g transform="translate(44,216)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#243358"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Difficulty</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">gentle and inviting  &#8596;  quietly brutal</text>
    </g>
    <g transform="translate(44,268)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#243358"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Themes &amp; Ninas</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">often hides a theme  &#8596;  never bothers</text>
    </g>
    <g transform="translate(44,320)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#243358"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Surfaces</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">vivid little stories  &#8596;  terse and clinical</text>
    </g>
    <g transform="translate(44,372)">
      <rect x="0" y="0" width="210" height="44" rx="10" fill="#2b3a63"/>
      <text x="105" y="29" fill="#c7d2fe" font-size="17" text-anchor="middle">Definitions</text>
      <text x="232" y="29" fill="#e5e9f7" font-size="17">sneaky and misleading  &#8596;  scrupulously straight</text>
    </g>
  </g>
</svg>
