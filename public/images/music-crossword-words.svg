      <g transform="translate(0,0)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">soft</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">piano</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">P</text></g>
      <g transform="translate(0,64)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">very soft</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">pianissimo</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">PP</text></g>
      <g transform="translate(0,128)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">loud</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">forte</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">F</text></g>
      <g transform="translate(0,192)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">very loud</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">fortissimo</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">FF</text></g>
      <g transform="translate(0,256)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">note</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">letter name</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">A&#8211;G</text></g>
      <g transform="translate(0,320)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">note</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">tonic sol-fa</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">DOH, TE</text></g>
