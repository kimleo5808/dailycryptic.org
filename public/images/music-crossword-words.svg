      <g transform="translate(0,320)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">instrument</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">woodwind</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">OBOE</text></g>
