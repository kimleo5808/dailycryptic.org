  <rect width="1000" height="520" rx="20" fill="url(#mbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="52" fill="#ffffff" font-size="28" font-weight="800">Musical shorthand in cryptic clues</text>
  <text x="44" y="82" fill="#94a3b8" font-size="17" font-weight="500">The clue word, where it comes from, and the letters it usually stands for.</text>

  <g font-weight="700">
