<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="20" fill="url(#zbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="52" fill="#ffffff" font-size="28" font-weight="800">The twelve signs and their crossword aliases</text>
  <text x="44" y="82" fill="#94a3b8" font-size="17" font-weight="500">A setter can clue any sign by its symbol — or clue the symbol using the sign.</text>

  <g font-weight="700">
    <!-- column 1 -->
    <g transform="translate(44,108)">
      <g transform="translate(0,0)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Aries</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Ram</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">RAM</text></g>
      <g transform="translate(0,64)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Taurus</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Bull</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">BULL</text></g>
      <g transform="translate(0,128)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Gemini</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Twins</text><text x="320" y="35" fill="#e5e9f7" font-size="19" font-weight="800">TWINS</text></g>
      <g transform="translate(0,192)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Cancer</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Crab</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">CRAB</text></g>
      <g transform="translate(0,256)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Leo</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Lion</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">LION</text></g>
      <g transform="translate(0,320)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Virgo</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Maiden</text><text x="310" y="35" fill="#e5e9f7" font-size="19" font-weight="800">VIRGIN</text></g>
    </g>
    <!-- column 2 -->
    <g transform="translate(516,108)">
      <g transform="translate(0,0)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Libra</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Scales</text><text x="300" y="35" fill="#e5e9f7" font-size="19" font-weight="800">SCALES</text></g>
      <g transform="translate(0,64)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Scorpio</text><text x="150" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Scorpion</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">STING</text></g>
      <g transform="translate(0,128)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Sagittarius</text><text x="180" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Archer</text><text x="310" y="35" fill="#e5e9f7" font-size="19" font-weight="800">ARCHER</text></g>
      <g transform="translate(0,192)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Capricorn</text><text x="180" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Goat</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">GOAT</text></g>
      <g transform="translate(0,256)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Aquarius</text><text x="180" y="35" fill="#94a3b8" font-size="16" font-weight="500">Water-bearer</text><text x="330" y="35" fill="#e5e9f7" font-size="16" font-weight="800">WATER</text></g>
      <g transform="translate(0,320)"><rect width="440" height="56" rx="10" fill="#17223f" stroke="#334066" stroke-width="1.2"/><text x="18" y="35" fill="#a5b4fc" font-size="19">Pisces</text><text x="180" y="35" fill="#94a3b8" font-size="16" font-weight="500">the Fishes</text><text x="330" y="35" fill="#e5e9f7" font-size="19" font-weight="800">FISH</text></g>
    </g>
  </g>
</svg>
