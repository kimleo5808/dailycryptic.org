<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
    <linearGradient id="rct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <!-- car icon, drawn in a 150x100 box -->
    <g id="car">
      <path d="M45,50 L58,32 L100,32 L113,50 Z" fill="#ffffff"/>
      <rect x="25" y="48" width="100" height="27" rx="8" fill="#ffffff"/>
      <path d="M63,48 L70,37 L82,37 L82,48 Z" fill="#6366f1"/>
      <path d="M88,48 L88,37 L97,37 L105,48 Z" fill="#6366f1"/>
      <circle cx="50" cy="77" r="10" fill="#0e1730" stroke="#ffffff" stroke-width="3"/>
      <circle cx="100" cy="77" r="10" fill="#0e1730" stroke="#ffffff" stroke-width="3"/>
    </g>
    <!-- cat icon, drawn in a 150x100 box -->
    <g id="cat">
      <path d="M52,44 L55,18 L72,34 Z" fill="#ffffff"/>
      <path d="M98,44 L95,18 L78,34 Z" fill="#ffffff"/>
      <circle cx="75" cy="58" r="28" fill="#ffffff"/>
      <circle cx="65" cy="55" r="4" fill="#4f46e5"/>
      <circle cx="85" cy="55" r="4" fill="#4f46e5"/>
      <path d="M71,65 L79,65 L75,70 Z" fill="#4f46e5"/>
      <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <line x1="47" y1="64" x2="30" y2="60"/><line x1="47" y1="70" x2="30" y2="72"/>
        <line x1="103" y1="64" x2="120" y2="60"/><line x1="103" y1="70" x2="120" y2="72"/>
      </g>
    </g>
  </defs>

  <rect width="1000" height="400" rx="20" fill="url(#rcbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="54" fill="#ffffff" font-size="28" font-weight="800">Same answer, two puzzles</text>
  <text x="44" y="84" fill="#94a3b8" font-size="17" font-weight="500">A picture rebus and a cryptic charade build CARPET the same way.</text>

  <!-- picture rebus -->
  <g transform="translate(44,108)">
    <rect width="440" height="212" rx="14" fill="#17223f" stroke="#4f5bd5" stroke-width="1.5"/>
    <text x="20" y="32" fill="#818cf8" font-size="15" font-weight="800">PICTURE REBUS</text>
    <rect x="40" y="48" width="150" height="104" rx="12" fill="url(#rct)"/>
    <use href="#car" transform="translate(40,50)"/>
    <text x="220" y="112" fill="#6b7aa8" font-size="38" font-weight="800" text-anchor="middle">+</text>
    <rect x="250" y="48" width="150" height="104" rx="12" fill="url(#rct)"/>
    <use href="#cat" transform="translate(250,50)"/>
    <text x="220" y="190" fill="#e5e9f7" font-size="19" font-weight="700" text-anchor="middle">car + pet = CARPET</text>
  </g>

  <!-- cryptic clue -->
  <g transform="translate(516,108)">
    <rect width="440" height="212" rx="14" fill="#17223f" stroke="#4f5bd5" stroke-width="1.5"/>
    <text x="20" y="32" fill="#818cf8" font-size="15" font-weight="800">CRYPTIC CLUE</text>
    <text x="20" y="74" fill="#ffffff" font-size="24" font-weight="800">&#8220;Motor and favourite rug (6)&#8221;</text>
    <g font-size="18" font-weight="700">
      <text x="20" y="118" fill="#a5b4fc">&#8220;motor&#8221;</text><text x="170" y="118" fill="#e5e9f7">= CAR</text>
      <text x="20" y="150" fill="#a5b4fc">&#8220;favourite&#8221;</text><text x="170" y="150" fill="#e5e9f7">= PET</text>
      <text x="20" y="182" fill="#a5b4fc">&#8220;rug&#8221;</text><text x="170" y="182" fill="#e5e9f7">= the definition</text>
    </g>
  </g>

  <text x="44" y="360" fill="#7c89b8" font-size="16" font-weight="500" font-style="italic">A picture rebus is a charade drawn instead of written: each picture is one chunk of the answer.</text>
</svg>
