<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#161f3c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <!-- car icon, drawn in a 150x100 box -->
    <g id="car">
      <path d="M45,50 L58,32 L100,32 L113,50 Z" fill="#ffffff"/>
      <rect x="25" y="48" width="100" height="27" rx="8" fill="#ffffff"/>
      <path d="M63,48 L70,37 L82,37 L82,48 Z" fill="#6366f1"/>
      <path d="M88,48 L88,37 L97,37 L105,48 Z" fill="#6366f1"/>
      <circle cx="50" cy="77" r="10" fill="#0e1730" stroke="#ffffff" stroke-width="3"/>
      <circle cx="100" cy="77" r="10" fill="#0e1730" stroke="#ffffff" stroke-width="3"/>
    </g>
    <!-- cat icon, drawn in a 150x100 box -->
    <g id="cat">
      <path d="M52,44 L55,18 L72,34 Z" fill="#ffffff"/>
      <path d="M98,44 L95,18 L78,34 Z" fill="#ffffff"/>
      <circle cx="75" cy="58" r="28" fill="#ffffff"/>
      <circle cx="65" cy="55" r="4" fill="#4f46e5"/>
      <circle cx="85" cy="55" r="4" fill="#4f46e5"/>
      <path d="M71,65 L79,65 L75,70 Z" fill="#4f46e5"/>
      <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <line x1="47" y1="64" x2="30" y2="60"/><line x1="47" y1="70" x2="30" y2="72"/>
        <line x1="103" y1="64" x2="120" y2="60"/><line x1="103" y1="70" x2="120" y2="72"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#tile)"/>

  <!-- eye = I, top-right -->
  <g transform="translate(990,72)">
    <path d="M0,30 Q40,-8 80,30 Q40,68 0,30 Z" fill="none" stroke="#818cf8" stroke-width="3"/>
    <circle cx="40" cy="30" r="13" fill="#818cf8"/>
    <circle cx="40" cy="30" r="5" fill="#0b1226"/>
    <text x="100" y="42" fill="#6b7aa8" font-size="34" font-weight="800">= I</text>
  </g>

  <text x="80" y="100" fill="#818cf8" font-size="21" font-weight="700" letter-spacing="3">SOLVING GUIDE · DAILYCRYPTIC</text>

  <g fill="#ffffff" font-weight="800">
    <text x="78" y="184" font-size="64">Rebus Puzzles:</text>
    <text x="78" y="256" font-size="64">Cryptic Clues in Pictures</text>
  </g>
  <text x="80" y="306" fill="#cbd5e1" font-size="26" font-weight="500">A car plus a pet makes CARPET, in pictures and in cryptic clues.</text>

  <!-- car + cat = CARPET -->
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="180" height="140" rx="16" fill="url(#tile)"/>
    <use href="#car" transform="translate(15,8)"/>
    <text x="90" y="126" fill="#dfe3f7" font-size="20" font-weight="600" text-anchor="middle">car</text>

    <text x="220" y="84" fill="#6b7aa8" font-size="44" font-weight="800" text-anchor="middle">+</text>

    <rect x="260" y="0" width="180" height="140" rx="16" fill="url(#tile)"/>
    <use href="#cat" transform="translate(275,8)"/>
    <text x="350" y="126" fill="#dfe3f7" font-size="20" font-weight="600" text-anchor="middle">a pet</text>

    <text x="480" y="84" fill="#6b7aa8" font-size="44" font-weight="800" text-anchor="middle">=</text>

    <rect x="520" y="0" width="320" height="140" rx="16" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="680" y="80" fill="#ffffff" font-size="48" font-weight="800" text-anchor="middle" letter-spacing="4">CARPET</text>
    <text x="680" y="118" fill="#a5b4fc" font-size="20" font-weight="700" text-anchor="middle">the answer</text>
  </g>
</svg>
