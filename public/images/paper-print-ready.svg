<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="380" rx="20" fill="url(#rbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="54" fill="#ffffff" font-size="28" font-weight="800">Get any puzzle print-ready</text>
  <text x="44" y="84" fill="#94a3b8" font-size="17" font-weight="500">A quick format conversion turns a screen grab into a clean sheet you can print.</text>

  <!-- Step 1: on screen -->
  <g transform="translate(60,130)">
    <rect x="0" y="0" width="220" height="170" rx="14" fill="#17223f" stroke="#334066" stroke-width="1.5"/>
    <rect x="40" y="34" width="140" height="86" rx="8" fill="#243358"/>
    <rect x="40" y="120" width="140" height="8" rx="4" fill="#334066"/>
    <rect x="86" y="128" width="48" height="12" rx="4" fill="#334066"/>
    <text x="110" y="156" fill="#c7d2fe" font-size="17" font-weight="700" text-anchor="middle">On screen</text>
    <text x="110" y="24" fill="#7c89b8" font-size="13" font-weight="700" text-anchor="middle">PNG / webpage</text>
  </g>

  <!-- arrow convert -->
  <g transform="translate(296,205)" stroke="#818cf8" stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="10" x2="60" y2="10"/>
    <path d="M48 0 L62 10 L48 20"/>
  </g>
  <text x="328" y="188" fill="#a5b4fc" font-size="15" font-weight="800" text-anchor="middle">convert</text>

  <!-- Step 2: clean PDF -->
  <g transform="translate(390,130)">
    <rect x="0" y="0" width="220" height="170" rx="14" fill="#17223f" stroke="#4f5bd5" stroke-width="1.5"/>
    <rect x="70" y="26" width="80" height="100" rx="6" fill="#f5f7fa"/>
    <path d="M132 26 L150 44 L132 44 Z" fill="#c7d0e0"/>
    <rect x="70" y="96" width="80" height="22" rx="3" fill="#6366f1"/>
    <text x="110" y="112" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">PDF</text>
    <text x="110" y="156" fill="#c7d2fe" font-size="17" font-weight="700" text-anchor="middle">Clean A4 PDF</text>
  </g>

  <!-- arrow print -->
  <g transform="translate(626,205)" stroke="#818cf8" stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="10" x2="60" y2="10"/>
    <path d="M48 0 L62 10 L48 20"/>
  </g>
  <text x="658" y="188" fill="#a5b4fc" font-size="15" font-weight="800" text-anchor="middle">print</text>

  <!-- Step 3: on paper -->
  <g transform="translate(720,130)">
    <rect x="0" y="0" width="220" height="170" rx="14" fill="#17223f" stroke="#334066" stroke-width="1.5"/>
    <rect x="58" y="30" width="104" height="76" rx="6" fill="#334066"/>
    <rect x="70" y="70" width="80" height="52" rx="4" fill="#f5f7fa"/>
    <g stroke="#94a3b8" stroke-width="1.2">
      <line x1="70" y1="88" x2="150" y2="88"/><line x1="96" y1="70" x2="96" y2="122"/><line x1="124" y1="70" x2="124" y2="122"/>
    </g>
    <text x="110" y="156" fill="#c7d2fe" font-size="17" font-weight="700" text-anchor="middle">On paper</text>
  </g>
</svg>
