<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#161f3c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#tile)"/>

  <!-- signature motif, top-right -->
  <g transform="translate(1000,92)" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M0 60 C22 10 34 96 54 52 C66 26 74 74 92 44 C104 24 116 40 128 34" stroke="#818cf8"/>
    <line x1="0" y1="86" x2="128" y2="86" stroke="#4f5bd5" stroke-width="4"/>
  </g>

  <text x="80" y="100" fill="#818cf8" font-size="21" font-weight="700" letter-spacing="3">SOLVING GUIDE · DAILYCRYPTIC</text>

  <g fill="#ffffff" font-weight="800">
    <text x="78" y="184" font-size="66">Know the Setter:</text>
    <text x="78" y="258" font-size="66">Every Cryptic Has a Voice</text>
  </g>
  <text x="80" y="308" fill="#cbd5e1" font-size="26" font-weight="500">Behind each puzzle is one person with signature tricks. Learn their voice and you can predict the next move.</text>

  <!-- two contrasting setter cards -->
  <g transform="translate(80,378)">
    <rect x="0" y="0" width="470" height="150" rx="16" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="28" y="52" fill="#ffffff" font-size="30" font-weight="800">The Trickster</text>
    <text x="28" y="90" fill="#a5b4fc" font-size="19" font-weight="600">Puns · &amp;lit · hidden Ninas</text>
    <text x="28" y="122" fill="#7c89b8" font-size="17" font-weight="500">Playful surfaces, groan-worthy jokes</text>

    <rect x="510" y="0" width="470" height="150" rx="16" fill="#141d38" stroke="#3a4a78" stroke-width="2"/>
    <text x="538" y="52" fill="#ffffff" font-size="30" font-weight="800">The Purist</text>
    <text x="538" y="90" fill="#93c5fd" font-size="19" font-weight="600">Tight anagrams · precise defs</text>
    <text x="538" y="122" fill="#7c89b8" font-size="17" font-weight="500">Clean, fair, quietly hard</text>
  </g>
</svg>
