<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="440" rx="20" fill="url(#cardbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <!-- heading -->
  <text x="44" y="58" fill="#ffffff" font-size="30" font-weight="800">One word, three tricks</text>
  <text x="44" y="90" fill="#94a3b8" font-size="18" font-weight="500">How often “about” signals each device across 500,000+ clues.</text>

  <!-- connectors (drawn first, behind nodes) -->
  <g fill="none" stroke="#3b4a78" stroke-width="3">
    <path d="M300 250 C 430 250, 430 150, 560 150"/>
    <path d="M300 250 L 560 250"/>
    <path d="M300 250 C 430 250, 430 350, 560 350"/>
  </g>

  <!-- ABOUT tile -->
  <rect x="80" y="188" width="220" height="124" rx="16" fill="url(#tile)"/>
  <text x="190" y="266" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle">ABOUT</text>

  <!-- device chips -->
  <!-- container -->
  <g transform="translate(560,110)">
    <rect x="0" y="0" width="392" height="80" rx="14" fill="#1e2a4a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="22" y="34" fill="#c7d2fe" font-size="22" font-weight="800">CONTAINER</text>
    <text x="22" y="62" fill="#94a3b8" font-size="17">one piece wrapped around another</text>
    <text x="370" y="48" fill="#818cf8" font-size="26" font-weight="800" text-anchor="end">1,897×</text>
  </g>
  <!-- reversal -->
  <g transform="translate(560,210)">
    <rect x="0" y="0" width="392" height="80" rx="14" fill="#1e2a4a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="22" y="34" fill="#c7d2fe" font-size="22" font-weight="800">REVERSAL</text>
    <text x="22" y="62" fill="#94a3b8" font-size="17">letters run backwards</text>
    <text x="370" y="48" fill="#818cf8" font-size="26" font-weight="800" text-anchor="end">494×</text>
  </g>
  <!-- anagram -->
  <g transform="translate(560,310)">
    <rect x="0" y="0" width="392" height="80" rx="14" fill="#1e2a4a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="22" y="34" fill="#c7d2fe" font-size="22" font-weight="800">ANAGRAM</text>
    <text x="22" y="62" fill="#94a3b8" font-size="17">letters rearranged</text>
    <text x="370" y="48" fill="#818cf8" font-size="26" font-weight="800" text-anchor="end">447×</text>
  </g>
</svg>
