<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#161f3c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#tile)"/>

  <!-- crossword grid motif, top-right -->
  <g transform="translate(1000,68)" opacity="0.9">
    <rect x="0"  y="0"  width="56" height="56" rx="6" fill="#6366f1"/>
    <rect x="61" y="0"  width="56" height="56" rx="6" fill="#1e2a4a"/>
    <rect x="0"  y="61" width="56" height="56" rx="6" fill="#1e2a4a"/>
    <rect x="61" y="61" width="56" height="56" rx="6" fill="#6366f1"/>
    <g fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">
      <text x="28" y="38">+</text>
      <text x="89" y="99">+</text>
    </g>
  </g>

  <text x="80" y="100" fill="#818cf8" font-size="21" font-weight="700" letter-spacing="3">SOLVING GUIDE · DAILYCRYPTIC</text>

  <g fill="#ffffff" font-weight="800">
    <text x="78" y="184" font-size="66">Charades: The Most</text>
    <text x="78" y="258" font-size="66">Common Cryptic Clue</text>
  </g>
  <text x="80" y="308" fill="#cbd5e1" font-size="26" font-weight="500">~40% of all clues are built this way. Here's how to assemble the answer, piece by piece.</text>

  <!-- assembly: CAR + PET = CARPET -->
  <g transform="translate(80,392)">
    <!-- CAR -->
    <rect x="0" y="0" width="170" height="118" rx="16" fill="url(#tile)"/>
    <text x="85" y="76" fill="#ffffff" font-size="52" font-weight="800" text-anchor="middle">CAR</text>
    <text x="85" y="150" fill="#94a3b8" font-size="22" font-weight="600" text-anchor="middle">“vehicle”</text>
    <!-- + -->
    <text x="210" y="74" fill="#6b7aa8" font-size="50" font-weight="800" text-anchor="middle">+</text>
    <!-- PET -->
    <rect x="252" y="0" width="170" height="118" rx="16" fill="url(#tile)"/>
    <text x="337" y="76" fill="#ffffff" font-size="52" font-weight="800" text-anchor="middle">PET</text>
    <text x="337" y="150" fill="#94a3b8" font-size="22" font-weight="600" text-anchor="middle">“animal”</text>
    <!-- = -->
    <text x="462" y="74" fill="#6b7aa8" font-size="50" font-weight="800" text-anchor="middle">=</text>
    <!-- CARPET -->
    <rect x="510" y="0" width="360" height="118" rx="16" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="690" y="76" fill="#ffffff" font-size="52" font-weight="800" text-anchor="middle">CARPET</text>
    <text x="690" y="150" fill="#a5b4fc" font-size="22" font-weight="700" text-anchor="middle">“floor covering”</text>
  </g>
</svg>
