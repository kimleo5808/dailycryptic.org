<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="470" rx="20" fill="url(#pbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="56" fill="#ffffff" font-size="28" font-weight="800">Homophone pairs setters love</text>
  <text x="44" y="86" fill="#94a3b8" font-size="17" font-weight="500">Two spellings, one sound — either can clue the other.</text>

  <!-- six pair cards in a 3x2 grid -->
  <g font-weight="800" text-anchor="middle">
    <!-- row 1 -->
    <g transform="translate(44,120)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">ALOUD <tspan fill="#6b7aa8">≈</tspan> ALLOWED</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">spoken / permitted</text>
    </g>
    <g transform="translate(355,120)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">KNIGHT <tspan fill="#6b7aa8">≈</tspan> NIGHT</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">chess piece / evening</text>
    </g>
    <g transform="translate(666,120)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">FLOUR <tspan fill="#6b7aa8">≈</tspan> FLOWER</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">baking / bloom</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(44,236)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">HEARD <tspan fill="#6b7aa8">≈</tspan> HERD</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">listened / cattle</text>
    </g>
    <g transform="translate(355,236)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">SEA <tspan fill="#6b7aa8">≈</tspan> SEE</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">ocean / view</text>
    </g>
    <g transform="translate(666,236)">
      <rect x="0" y="0" width="290" height="96" rx="14" fill="#1b2748"/>
      <text x="145" y="44" fill="#ffffff" font-size="27">BARE <tspan fill="#6b7aa8">≈</tspan> BEAR</text>
      <text x="145" y="74" fill="#94a3b8" font-size="15" font-weight="600">uncovered / animal</text>
    </g>
  </g>

  <text x="44" y="400" fill="#c7d2fe" font-size="18" font-weight="600">Tip: when a clue mentions sound, test the answer against a same-sounding word.</text>
  <text x="44" y="430" fill="#7c89b8" font-size="15" font-weight="500">Pronunciation can vary by accent — read candidates aloud to be sure.</text>
</svg>
