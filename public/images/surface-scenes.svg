<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="430" rx="20" fill="url(#scbg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="54" fill="#ffffff" font-size="28" font-weight="800">A surface is a scene — literally</text>
  <text x="44" y="84" fill="#94a3b8" font-size="17" font-weight="500">Each clue&#8217;s surface reading is a ready-made picture you could hand to an image generator.</text>

  <!-- three scene cards -->
  <g>
    <!-- card 1: wild cat -->
    <g transform="translate(44,116)">
      <rect x="0" y="0" width="290" height="240" rx="16" fill="#17223f" stroke="#334066" stroke-width="1.5"/>
      <g transform="translate(145,92)">
        <circle cx="0" cy="0" r="46" fill="#243358"/>
        <path d="M-26 -30 L-14 -8 L-38 -8 Z" fill="#818cf8"/>
        <path d="M26 -30 L14 -8 L38 -8 Z" fill="#818cf8"/>
        <circle cx="-15" cy="-2" r="6" fill="#c7d2fe"/>
        <circle cx="15" cy="-2" r="6" fill="#c7d2fe"/>
        <path d="M-4 14 L4 14 L0 20 Z" fill="#c7d2fe"/>
        <line x1="-40" y1="12" x2="-14" y2="10" stroke="#6b7aa8" stroke-width="2"/>
        <line x1="40" y1="12" x2="14" y2="10" stroke="#6b7aa8" stroke-width="2"/>
      </g>
      <text x="145" y="184" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">&#8220;A wild cat</text>
      <text x="145" y="210" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">on the loose&#8221;</text>
    </g>

    <!-- card 2: treasure at midnight -->
    <g transform="translate(355,116)">
      <rect x="0" y="0" width="290" height="240" rx="16" fill="#17223f" stroke="#334066" stroke-width="1.5"/>
      <g transform="translate(145,92)">
        <circle cx="34" cy="-30" r="20" fill="#fbbf24" opacity="0.85"/>
        <circle cx="41" cy="-34" r="16" fill="#17223f"/>
        <rect x="-46" y="8" width="92" height="46" rx="8" fill="#6366f1"/>
        <rect x="-46" y="4" width="92" height="16" rx="6" fill="#818cf8"/>
        <rect x="-8" y="16" width="16" height="14" rx="3" fill="#fbbf24"/>
      </g>
      <text x="145" y="184" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">&#8220;Pirates bury</text>
      <text x="145" y="210" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">gold at midnight&#8221;</text>
    </g>

    <!-- card 3: chef burns dinner -->
    <g transform="translate(666,116)">
      <rect x="0" y="0" width="290" height="240" rx="16" fill="#17223f" stroke="#334066" stroke-width="1.5"/>
      <g transform="translate(145,92)">
        <ellipse cx="0" cy="26" rx="46" ry="12" fill="#243358"/>
        <rect x="-46" y="10" width="92" height="18" rx="6" fill="#334066"/>
        <rect x="44" y="14" width="34" height="8" rx="4" fill="#334066"/>
        <path d="M-14 8 Q-22 -18 -6 -26 Q-14 -6 2 -14 Q-2 4 -14 8 Z" fill="#fbbf24"/>
        <path d="M8 8 Q2 -10 12 -18 Q6 -4 18 -10 Q14 4 8 8 Z" fill="#f59e0b"/>
      </g>
      <text x="145" y="184" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">&#8220;The nervous chef</text>
      <text x="145" y="210" fill="#e5e9f7" font-size="18" font-weight="700" text-anchor="middle">burns dinner&#8221;</text>
    </g>
  </g>

  <text x="44" y="400" fill="#7c89b8" font-size="15" font-weight="500" font-style="italic">None of these scenes is the answer — that&#8217;s the trick. But each one makes a vivid picture.</text>
</svg>
