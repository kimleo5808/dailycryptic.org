<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#1a2342"/>
    </linearGradient>
    <linearGradient id="cet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="380" rx="20" fill="url(#cebg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="#6366f1"/>

  <text x="44" y="54" fill="#ffffff" font-size="28" font-weight="800">How a sign hides in a clue</text>
  <text x="44" y="84" fill="#94a3b8" font-size="17" font-weight="500">A double definition: two meanings of the same answer, no indicator needed.</text>

  <!-- clue -->
  <rect x="44" y="108" width="912" height="60" rx="12" fill="#141d3a" stroke="#2a3a63" stroke-width="1.5"/>
  <text x="500" y="147" fill="#e5e9f7" font-size="28" font-weight="800" text-anchor="middle">&#8220;The Scales, or a balance (5)&#8221;</text>

  <!-- two defs -->
  <g transform="translate(44,196)">
    <rect x="0" y="0" width="300" height="84" rx="12" fill="#17223f" stroke="#4f5bd5" stroke-width="1.5"/>
    <text x="20" y="34" fill="#818cf8" font-size="15" font-weight="800">DEFINITION 1</text>
    <text x="20" y="62" fill="#e5e9f7" font-size="19" font-weight="700">&#8220;the Scales&#8221; = the sign</text>
  </g>
  <g transform="translate(360,196)">
    <rect x="0" y="0" width="300" height="84" rx="12" fill="#17223f" stroke="#4f5bd5" stroke-width="1.5"/>
    <text x="20" y="34" fill="#818cf8" font-size="15" font-weight="800">DEFINITION 2</text>
    <text x="20" y="62" fill="#e5e9f7" font-size="19" font-weight="700">&#8220;a balance&#8221; = its meaning</text>
  </g>

  <!-- answer -->
  <g transform="translate(700,196)">
    <rect x="0" y="0" width="256" height="84" rx="12" fill="#1e2a4a" stroke="#818cf8" stroke-width="2"/>
    <text x="128" y="56" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="5">LIBRA</text>
  </g>

  <text x="44" y="330" fill="#7c89b8" font-size="16" font-weight="500" font-style="italic">Both halves point to LIBRA — the Latin for &#8220;scales&#8221;, and the seventh sign of the zodiac.</text>
</svg>
